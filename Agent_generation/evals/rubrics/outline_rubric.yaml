# 大纲阶段结构质量 Rubric（3 维 · 二值检查项）
# 大纲阶段只评“面”的覆盖与结构，不评措辞细节（与对抗审查 ModelB 的职责边界一致）
version: outline-v1.1
dimensions:
  O1:
    name: 覆盖度
    weight: 0.45
    desc: 必备条款面 + 用户特殊需求是否在大纲中有对应章节/条款
    items:
      - {id: O1.1, text: "大纲包含该合同类型的标的/内容、价款支付、期限、权利义务四类核心章节或条款", weight: 2}
      - {id: O1.2, text: "大纲包含违约责任、解除/终止、争议解决三类救济条款", weight: 2}
      - {id: O1.3, text: "大纲包含该合同类型特有的关键条款面（如租赁的维修与返还、技术服务的SLA、买卖的验收与质保、授权的授权范围与使用限制）", weight: 2}
      # O1.S* 自动追加：每条用户特殊需求在大纲中有对应条款（权重 1.5）
  O2:
    name: 结构合理性
    weight: 0.35
    desc: 章节划分、层级与归属是否合理
    items:
      - {id: O2.1, text: "层级不超过三级（章节-条款-子条款），无空章节（有标题但无任何条款）", weight: 1}
      - {id: O2.2, text: "条款归属正确：条款内容与其所在章节标题主题一致，未出现明显错放", weight: 1}
      - {id: O2.3, text: "不存在两个章节/条款主题重复或内容重叠", weight: 1}
      - {id: O2.4, text: "章节顺序符合合同惯例（标的→价款→履行→权利义务→违约→解除→争议→其他）", weight: 0.5}
      - {id: O2.5, text: "首部（标题、当事人）与尾部（签章、日期）结构完整", weight: 0.5}
  O3:
    name: 可起草性
    weight: 0.20
    desc: 条款概要是否足以指导后续起草
    items:
      - {id: O3.1, text: "条款大致说明写明了该条要约定的要点，而非仅重复章节标题或空泛表述（如“其他约定”“相关事项”）", weight: 1}
      - {id: O3.2, text: "用户已明确的关键数值（金额/期限/比例）在对应条款概要中已体现", weight: 1}
      - {id: O3.3, text: "需要后续填写的当事人信息等使用了占位符，且占位符命名语义清晰", weight: 0.5}
