# 端到端合同质量 Rubric（6 维 · 分析型 · 二值检查项）
# 设计原则：
#   - 每个维度拆成可观察的二值检查项（yes/no），由 Judge 逐项判断并给出原文证据；分数 = 加权通过率
#   - 通用检查项 + 用例专属检查项（由数据集 special_requirements 自动生成到 D1）
#   - 检查项措辞避免“是否优秀/是否合理”等主观词，改为“是否写明/是否存在/是否一致”等可核验表述
#   - 修改检查项必须升级 version（报告中记录 rubric 内容哈希，不同版本结果不可直接比较）
version: e2e-v1.3
# v1.3 校准（2026-11-07）：v1.2 审计发现 D2.2/D5.1/D5.3/D2.8 把“用户未提供的值使用占位符”判为不通过，
#   而单 LLM 因编造具体数值得分 —— 检查项混淆了“缺失”与“待填”（效度问题）。
#   v1.3 在检查项与 Judge 规则中明确占位符口径；用户已给定的值仍由 D1.2 / D1.S* 严格考核。
dimensions:
  D1:
    name: 需求符合度
    weight: 0.25
    desc: 用户明确提出的要素与特殊需求是否被准确、具体地写入合同（而非占位符或笼统表述）
    items:
      - {id: D1.1, text: "合同类型、签约主体类型（个人/企业）与用户需求一致", weight: 1}
      - {id: D1.2, text: "用户给出的具体数值（金额、期限、比例、天数等）在合同中以具体数值写明，而不是用占位符代替", weight: 2}
      # 用例专属检查项 D1.S* 自动追加：每条 special_requirement 一项，权重 2
  D2:
    name: 条款完整性
    weight: 0.20
    desc: 该合同类型的必备条款与风险条款是否齐备
    items:
      - {id: D2.1, text: "写明合同标的/服务内容及其范围、数量或标准", weight: 1}
      - {id: D2.2, text: "写明价款/费用的金额或计算方式、支付方式与支付时间（用户未提供的具体数值可用占位符）", weight: 1}
      - {id: D2.3, text: "写明履行期限、交付或验收的方式与标准", weight: 1}
      - {id: D2.4, text: "分别写明双方的主要权利与义务", weight: 1}
      - {id: D2.5, text: "写明违约情形及对应的违约责任（违约金或赔偿的计算方式）", weight: 1}
      - {id: D2.6, text: "写明合同解除或终止的条件，以及解除后的处理", weight: 1}
      - {id: D2.7, text: "包含不可抗力条款（范围、通知义务、责任承担）", weight: 0.5}
      - {id: D2.8, text: "写明争议解决方式（诉讼或仲裁）及管辖法院/仲裁机构或其确定规则（用户未指定机构时可用占位符或确定规则）", weight: 1}
      - {id: D2.9, text: "包含通知与送达条款（送达地址或方式）", weight: 0.5}
      - {id: D2.10, text: "合同尾部有双方签章/签字栏与签署日期", weight: 0.5}
  D3:
    name: 法律合规性
    weight: 0.20
    desc: 条款是否符合中国现行法律（以《民法典》为核心）且不含明显无效或显失公平的约定
    items:
      - {id: D3.1, text: "引用的法律名称为现行有效法律（例如引用《民法典》而非已废止的《合同法》《担保法》等）；未引用法律则判 yes", weight: 1}
      - {id: D3.2, text: "不存在免除一方造成对方人身损害责任，或免除因故意、重大过失造成对方财产损失责任的条款", weight: 1}
      - {id: D3.3, text: "违约金或赔偿约定有明确计算方式，且未约定明显畸高的惩罚性金额（如超过实际损失数倍且无上限）", weight: 1}
      - {id: D3.4, text: "格式化的单方权利（如单方解除、单方调价、单方扣款）设有触发条件或程序，而非无条件赋予", weight: 1}
      - {id: D3.5, text: "不包含违反强制性规定的内容（如劳动类排除法定权利、租赁超过20年、竞业限制超过2年等）", weight: 1}
  D4:
    name: 内部一致性
    weight: 0.15
    desc: 金额、期限、主体称谓、条款交叉引用等在全文中是否前后一致
    items:
      - {id: D4.1, text: "全文对同一金额/比例/期限的表述一致，未出现相互矛盾的数值", weight: 2}
      - {id: D4.2, text: "当事人称谓（甲方/乙方、出租方/承租方等）全文统一，未混用或指代错位", weight: 1}
      - {id: D4.3, text: "条款中“见第X条/依本合同第X条”的交叉引用指向的条款确实存在且内容相符", weight: 1}
      - {id: D4.4, text: "不存在两个条款对同一事项作出相互冲突的约定", weight: 2}
  D5:
    name: 可执行性
    weight: 0.12
    desc: 关键义务是否可操作、可量化、可举证
    items:
      - {id: D5.1, text: "关键履约义务约定了时间节点或期限条款（如“X日内”；用户未提供的天数可为占位符，但不能缺少期限约定）", weight: 1}
      - {id: D5.2, text: "验收、考核或交接有可判定的标准或程序（如清单、指标、签收）", weight: 1}
      - {id: D5.3, text: "违约责任写明了计算基数与计算方式（如“按日万分之X”“X个月租金”；比例未由用户给定时可为占位符）", weight: 1}
      - {id: D5.4, text: "关键通知/确认要求书面形式或约定了明确的送达方式", weight: 0.5}
  D6:
    name: 结构与表述规范
    weight: 0.08
    desc: 结构层级清晰、编号连续、措辞专业无歧义
    items:
      - {id: D6.1, text: "章节编号与条款编号连续，无跳号、重号", weight: 1}
      - {id: D6.2, text: "未出现模型痕迹或无关内容（如“作为AI”“以下是”、Markdown符号、重复段落）", weight: 1}
      - {id: D6.3, text: "未出现明显歧义或口语化表述（如“大概”“尽量”“差不多”用于约定义务）", weight: 1}
      - {id: D6.4, text: "首部写明合同名称与双方当事人基本信息栏", weight: 0.5}
pairwise_dims:
  - {id: P1, name: 需求符合度, desc: 是否准确、具体地落实了用户的全部需求}
  - {id: P2, name: 条款完整性与风险覆盖, desc: 必备条款与风险条款是否齐全}
  - {id: P3, name: 法律合规与一致性, desc: 是否合法、前后一致、无矛盾}
  - {id: P4, name: 可执行性, desc: 义务是否可操作、可量化}
